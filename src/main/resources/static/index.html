<!DOCTYPE html>
<html class="dark" lang="ru">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>ArchAssistant | ЭР-Телеком</title>

    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-high": "#1a1a1a",
                        "surface-container-lowest": "#050505",
                        "primary": "#0054a6",
                        "outline-variant": "rgba(255,255,255,0.1)"
                    }
                }
            }
        }
    </script>
</head>
<body class="flex h-screen overflow-hidden">

<aside class="w-80 bg-surface-container-lowest border-r border-outline-variant flex flex-col">
    <div class="p-6">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-10 h-10 bg-primary rounded-xl flex items-center justify-center">
                <span class="material-symbols-outlined text-white">architecture</span>
            </div>
            <span class="text-xl font-bold font-headline uppercase tracking-tight">ArchAssistant</span>
        </div>
        <button onclick="createNewChat()" class="w-full py-3 bg-white text-black rounded-full font-bold flex items-center justify-center gap-2 hover:bg-gray-200 transition-all active:scale-95">
            <span class="material-symbols-outlined">add</span> Новый проект
        </button>
    </div>
    <nav id="chat-list" class="flex-1 overflow-y-auto px-4 space-y-1"></nav>
    <div class="p-4 border-t border-outline-variant text-center">
        <p class="text-[10px] text-gray-500 uppercase tracking-widest">ЭР-Телеком Холдинг</p>
    </div>
</aside>

<main class="flex-1 flex flex-col bg-surface-container-lowest">
    <header class="h-16 border-b border-outline-variant flex items-center justify-between px-8">
        <div id="active-chat-title" class="font-headline font-bold text-gray-400">Выберите проект в меню</div>
        <div class="flex items-center gap-3">
            <div id="loader" class="hidden dot-pulse"></div>
            <button id="stop-stream-btn" class="hidden w-8 h-8 rounded-full flex items-center justify-center border border-outline-variant hover:bg-white/5 text-red-400 transition-all" onclick="stopStreaming()">
                <span class="material-symbols-outlined text-lg">stop</span>
            </button>
        </div>
    </header>

    <div id="chat-window" class="flex-1 overflow-y-auto p-8 space-y-8"></div>

    <div class="p-6 bg-gradient-to-t from-black via-black/80 to-transparent">
        <div class="max-w-4xl mx-auto bg-surface-container-high rounded-3xl border border-outline-variant p-2 shadow-2xl">
            <div class="flex items-end gap-2 p-1">
                    <textarea id="user-input" rows="1"
                              placeholder="Введите описание задачи..."
                              class="flex-1 bg-transparent border-none text-white focus:ring-0 resize-none py-3 px-4 text-sm"></textarea>

                <div class="flex gap-2 pb-1 pr-1">
                    <button onclick="handleAction('/api/ai/validate', 'solution')" class="w-10 h-10 rounded-full flex items-center justify-center border border-outline-variant hover:bg-white/5 text-green-500 transition-all">
                        <span class="material-symbols-outlined">fact_check</span>
                    </button>
                    <button onclick="handleAction('/api/ai/stream', 'message')" class="w-10 h-10 bg-primary rounded-full flex items-center justify-center hover:scale-105 transition-all">
                        <span class="material-symbols-outlined text-white">send</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="script.js"></script>
</body>
</html>
