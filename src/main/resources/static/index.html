<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с ИИ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            padding: 20px;
        }
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            overflow: hidden;
        }
        .chat-header {
            background: #16213e;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .chat-messages {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .message {
            margin-bottom: 15px;
            display: flex;
        }
        .message.user {
            justify-content: flex-end;
        }
        .message-content {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 18px;
        }
        .message.user .message-content {
            background: #16213e;
            color: white;
        }
        .message.assistant .message-content {
            background: white;
            color: #333;
            border: 1px solid #ddd;
        }
        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #ddd;
        }
        .input-area textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            margin-bottom: 10px;
        }
        .button-group {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .btn-send {
            background: #16213e;
            color: white;
        }
        .btn-file {
            background: #e9ecef;
            color: #333;
        }
        .loading {
            text-align: center;
            padding: 10px;
            color: #666;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="chat-header">
        <h2>🤖 Помощник ИТ-архитектора</h2>
        <p>Просто напишите вопрос</p>
    </div>

    <div class="chat-messages" id="messages">
        <div class="message assistant">
            <div class="message-content">Привет! Задай любой вопрос.</div>
        </div>
    </div>

    <div class="input-area">
        <textarea id="messageInput" rows="3" placeholder="Введите сообщение..." onkeypress="if(event.key==='Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); }"></textarea>

        <div class="button-group">
            <button class="btn-send" onclick="sendMessage()">✈️ Отправить</button>
            <input type="file" id="fileInput" style="display:none">
            <button class="btn-file" onclick="document.getElementById('fileInput').click()">📎 Файл</button>
        </div>
    </div>
</div>

<script>
    const messagesDiv = document.getElementById('messages');
    const messageInput = document.getElementById('messageInput');
    const fileInput = document.getElementById('fileInput');

    function addMessage(role, text) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        const content = document.createElement('div');
        content.className = 'message-content';
        content.innerHTML = text.replace(/\n/g, '<br>');
        messageDiv.appendChild(content);
        messagesDiv.appendChild(messageDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function showLoading() {
        const loading = document.createElement('div');
        loading.id = 'loading';
        loading.className = 'loading';
        loading.textContent = '🤔 Думаю...';
        messagesDiv.appendChild(loading);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    function hideLoading() {
        const loading = document.getElementById('loading');
        if (loading) loading.remove();
    }

    async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        messageInput.value = '';
        addMessage('user', message);
        showLoading();

        try {
            const response = await fetch('/api/ai/generate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: message })
            });

            const text = await response.text();
            let data;
            try {
                data = JSON.parse(text);
            } catch(e) {
                console.error('JSON error:', text);
                throw new Error('Сервер вернул невалидный JSON');
            }

            hideLoading();
            addMessage('assistant', data.response || 'Нет ответа');
        } catch (error) {
            hideLoading();
            addMessage('assistant', '❌ Ошибка: ' + error.message);
        }
    }

    fileInput.onchange = async function() {
        const file = fileInput.files[0];
        if (!file) return;

        addMessage('user', `📎 Файл: ${file.name}`);
        showLoading();

        const formData = new FormData();
        formData.append('file', file);

        try {
            const response = await fetch('/api/documents/upload/temp', {
                method: 'POST',
                body: formData
            });

            const text = await response.text();
            let result;
            try {
                result = JSON.parse(text);
            } catch(e) {
                throw new Error('Сервер вернул невалидный JSON');
            }

            hideLoading();
            if (result.success) {
                addMessage('assistant', `✅ Файл "${result.fileName}" загружен. Текст: ${result.textLength || 0} символов.`);
            } else {
                addMessage('assistant', '❌ ' + (result.message || 'Ошибка загрузки'));
            }
        } catch (error) {
            hideLoading();
            addMessage('assistant', '❌ Ошибка: ' + error.message);
        }

        fileInput.value = '';
    };
</script>
</body>
</html>
