spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:5432/archassistant
    username: postgres
    password: 233122
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml
    drop-first: false
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: Qwen3:1.7b
        options:
          temperature: 0.3
          num_ctx: 4096
          num_predict: 1024
          num_thread: 10
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        schema: public
        table-name: vector_store
        initialize-schema: true

learning:
  schedule: "0 0 0 1 * ?"
  chunk-size: 1000

ocr:
  tesseract:
    enabled: true
    executable: "C:/Program Files/Tesseract-OCR/tesseract.exe"
    language: rus+eng
    timeout-seconds: 120

logging:
  level:
    com.ertekom: DEBUG
