spring:
  main:
    allow-bean-definition-overriding: true
  datasource:
    url: jdbc:postgresql://localhost:5432/archassistant
    username: postgres
    password: 233122
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: ${MODEL}
        options:
          temperature: 0.3
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        schema: public
        table-name: vector_store
        initialize-schema: true

learning:
  schedule: "0 0 0 1 * ?"
  chunk-size: 1000

logging:
  level:
    com.ertekom: DEBUG