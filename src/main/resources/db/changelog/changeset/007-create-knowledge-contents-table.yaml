databaseChangeLog:
  - changeSet:
      id: 007-create-knowledge-contents-table
      author: archassistant
      changes:
        - createTable:
            tableName: knowledge_contents
            remarks: "Таблица содержимого знаний (чанки)"
            columns:
              - column:
                  name: content_id
                  type: UUID
                  remarks: "Идентификатор содержимого"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chunk_index
                  type: INT
                  remarks: "Индекс чанка"
                  constraints:
                    nullable: false
              - column:
                  name: chunk_content
                  type: TEXT
                  remarks: "Содержание чанка"
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: "Дата создания"
              - column:
                  name: file_id
                  type: UUID
                  remarks: "Ссылка на файл знаний"
        - addForeignKeyConstraint:
            constraintName: fk_knowledge_content_file
            baseTableName: knowledge_contents
            baseColumnNames: file_id
            referencedTableName: knowledge_files
            referencedColumnNames: file_id