databaseChangeLog:
  - changeSet:
      id: 004-create-document-chunks-table
      author: archassistant
      changes:
        - createTable:
            tableName: document_chunks
            remarks: "Таблица чанков документов"
            columns:
              - column:
                  name: chunk_id
                  type: UUID
                  remarks: "Идентификатор чанка"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: chunk_index
                  type: INT
                  remarks: "Индекс чанка"
                  constraints:
                    nullable: false
              - column:
                  name: chunk_content
                  type: TEXT
                  remarks: "Содержание чанка"
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: "Дата создания"
              - column:
                  name: document_id
                  type: UUID
                  remarks: "Ссылка на документ"
              - column:
                  name: chat_id
                  type: UUID
                  remarks: "Ссылка на чат"
        - addForeignKeyConstraint:
            constraintName: fk_chunk_document
            baseTableName: document_chunks
            baseColumnNames: document_id
            referencedTableName: documents
            referencedColumnNames: document_id
        - addForeignKeyConstraint:
            constraintName: fk_chunk_chat
            baseTableName: document_chunks
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: chat_id