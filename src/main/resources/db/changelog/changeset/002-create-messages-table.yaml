databaseChangeLog:
  - changeSet:
      id: 002-create-messages-table
      author: archassistant
      changes:
        - createTable:
            tableName: messages
            remarks: "Таблица сообщений"
            columns:
              - column:
                  name: message_id
                  type: UUID
                  remarks: "Идентификатор сообщения"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(255)
                  remarks: "Роль (user/assistant)"
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  remarks: "Содержание сообщения"
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: "Дата создания"
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  remarks: "Дата обновления"
              - column:
                  name: chat_id
                  type: UUID
                  remarks: "Ссылка на чат"
        - addForeignKeyConstraint:
            constraintName: fk_message_chat
            baseTableName: messages
            baseColumnNames: chat_id
            referencedTableName: chats
            referencedColumnNames: chat_id