databaseChangeLog:
  - changeSet:
      id: 006-create-knowledge-files-table
      author: archassistant
      changes:
        - createTable:
            tableName: knowledge_files
            remarks: "Таблица файлов знаний"
            columns:
              - column:
                  name: file_id
                  type: UUID
                  remarks: "Идентификатор файла"
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: file_name
                  type: VARCHAR(255)
                  remarks: "Имя файла"
                  constraints:
                    nullable: false
              - column:
                  name: file_path
                  type: VARCHAR(255)
                  remarks: "Путь к файлу"
              - column:
                  name: file_hash
                  type: VARCHAR(255)
                  remarks: "Хеш файла"
              - column:
                  name: version
                  type: INT
                  remarks: "Версия файла"
              - column:
                  name: is_current
                  type: BOOLEAN
                  remarks: "Признак текущей версии"
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  remarks: "Дата создания"
              - column:
                  name: source_id
                  type: UUID
                  remarks: "Ссылка на источник знаний"
        - addForeignKeyConstraint:
            constraintName: fk_knowledge_file_source
            baseTableName: knowledge_files
            baseColumnNames: source_id
            referencedTableName: knowledge_sources
            referencedColumnNames: source_id